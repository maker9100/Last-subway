<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151c1c">
  <meta name="description" content="실제 한국 시간으로 달리는 열차, 여덟 개의 역과 작은 만남. 3D 소셜 철도 여행 Last Train.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect fill='%23d4a05c' width='40' height='40' rx='6'/%3E%3Cpath d='M10 9h20v19H10zM14 33l3-5m9 5l-3-5' fill='none' stroke='%23151c1c' stroke-width='3'/%3E%3Cpath d='M14 14h12v8H14z' fill='%23151c1c'/%3E%3C/svg%3E">
  <title>Last Train · 느긋한 여행</title>
</head>
<body>
  <canvas id="game" aria-label="3D 게임 화면"></canvas>
  <div id="login" class="veil">
    <form id="login-form" class="departure-card">
      <div class="eyebrow">한국 표준시 실시간 철도 / 8개 역</div>
      <div class="ticket-rule"></div>
      <h1>LAST<br><span>TRAIN</span><b class="title-dot">●</b></h1>
      <p class="intro">서두르지 않아도 괜찮은 여행.<br>다음 열차는 5분 뒤에 찾아옵니다.</p>
      <label for="nickname">여행자 이름</label>
      <div class="input-row"><input id="nickname" name="nickname" minlength="2" maxlength="12" autocomplete="nickname" placeholder="닉네임 2~12자" required><button id="start" type="submit">출발하기 ↗</button></div>
      <p id="login-status" role="status">여덟 개의 역 · 같은 열차에서 만나는 사람들</p>
      <div class="ticket-footer"><span>중앙 → 초원 → 설원 → 해변</span><span>심해 → 정글 → 산맥 → 사막</span></div>
    </form>
  </div>
  <main id="hud" hidden>
    <header class="top-panel panel"><div><small>LAST TRAIN / 현재 위치</small><strong id="place">중앙역</strong><span id="channel">채널 1</span></div><div class="time-column"><time id="clock">00:00:00</time><span id="network">연결 중</span></div></header>
    <section class="board panel"><div class="board-label"><span>열차 운행 안내</span><span id="season-label"></span></div><strong id="board-status">시간표 동기화 중</strong><div id="board-detail"></div></section>
    <nav class="tools"><button id="route-button">노선도 M</button><button id="collection-button">수집 도감</button><button id="settings-button">설정</button></nav>
    <div id="crosshair">＋</div><div id="prompt" class="prompt" hidden></div>
    <div id="self-state" class="self-state"></div>
    <div id="ticket" class="ticket-mini panel" hidden></div>
    <section id="chat-panel"><div id="chat-log" role="log" aria-live="polite"></div><form id="chat-form" hidden><input id="chat-input" maxlength="100" autocomplete="off" aria-label="채팅" placeholder="메시지 입력 · Enter 전송 / Esc 닫기"></form></section>
    <footer class="help">WASD 이동 · 마우스 시점 · E 상호작용 · F 인사 · 1~5 이모션 · Enter 채팅 · Esc 해제</footer>
    <div id="resume" class="resume" hidden><button id="resume-button">클릭하여 여행 계속하기</button><span>Esc로 마우스 해제</span></div>
    <div id="touch-controls"><div id="joystick"><i id="stick"></i></div><button id="touch-action">E</button><button id="touch-chat">대화</button><button id="touch-wave">인사</button></div>
  </main>
  <div id="notifications" aria-live="polite"></div>
  <dialog id="modal"><div class="modal-top"><h2 id="modal-title"></h2><button id="modal-close" aria-label="닫기">닫기 ×</button></div><div id="modal-body"></div></dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
